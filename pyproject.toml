[project]
name = "pos"
version = "0.1.0"
description = "Boutique POS API"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "alembic>=1.18.5",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.140.7",
    "psycopg2-binary>=2.9.12",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["app/tests"]
addopts = [
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=90",
]

[tool.coverage.run]
omit = ["app/tests/*"]

[tool.coverage.report]
skip_empty = true